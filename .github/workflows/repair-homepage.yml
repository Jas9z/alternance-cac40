name: Repair homepage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-homepage.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore complete page and neutral copy
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          original = subprocess.check_output(['git', 'show', '9b915a983484f3459684f49c5d91f998455f9e82:index.html']).decode('utf-8')
          html = original
          scripts = re.findall(r'<script\b[^>]*>.*?</script>', original, re.S | re.I)
          styles = re.findall(r'<style\b[^>]*>.*?</style>', original, re.S | re.I)
          assert scripts and styles and len(original) > 50000
          html = re.sub(r'<title>.*?</title>', '<title>Alternances CAC40 — Ingénierie d’affaires</title>', html, count=1, flags=re.S)
          html = re.sub(r'<meta name="description"[^>]*>', '<meta name="description" content="Explorez les offres d’alternance en ingénierie d’affaires, business development et vente B2B." />', html, count=1)
          html = re.sub(r'<a\b[^>]*href=["\'][^"\']*(?:linkedin\.com/in/|CV_Jasim|mailto:)[^"\']*["\'][^>]*>.*?</a>', '', html, flags=re.S | re.I)
          replacements = {
              'nav-logo': 'Alternances<span>.</span>',
              'hero-eyebrow': 'Votre prochaine alternance',
              'hero-sub': 'Explorez les opportunités en ingénierie d’affaires, business development et vente B2B. Filtrez les offres et organisez vos candidatures depuis un seul espace.',
              'about-tag': 'La plateforme',
              'about-text': 'Un espace pour découvrir des offres d’alternance, comparer les opportunités et suivre vos démarches. Vérifiez la disponibilité et les conditions sur chaque annonce d’origine.',
              'footer-name': 'Alternances CAC40',
              'footer-sub': 'Plateforme indépendante de recherche d’alternance. Non affiliée aux entreprises référencées.'
          }
          for cls, text in replacements.items():
              pattern = r'(<(?P<tag>div|p|span)\b[^>]*class="' + cls + r'"[^>]*>).*?(</(?P=tag)>)'
              html, count = re.subn(pattern, lambda m: m.group(1) + text + m.group(3), html, flags=re.S)
              assert count >= 1, cls
          html = re.sub(r'(<section\b[^>]*class="hero"[^>]*>.*?)<h1>.*?</h1>', r'\1<h1>Trouvez votre<br><em>alternance.</em></h1>', html, count=1, flags=re.S)
          html = html.replace('Jasim Bouchekoua', 'Alternances CAC40')
          assert re.findall(r'<script\b[^>]*>.*?</script>', html, re.S | re.I) == scripts
          assert re.findall(r'<style\b[^>]*>.*?</style>', html, re.S | re.I) == styles
          assert len(html) > 45000
          assert not re.search(r'linkedin\.com/in/|CV_Jasim|Jasim Bouchekoua', html, re.I)
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Commit repaired homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete homepage and remove personal branding"
            git push origin HEAD:main
          fi
