name: Scraper LinkedIn Alternance Quotidien

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-linkedin-alternance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Chrome + Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
          google-chrome --version
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Lancer scraper LinkedIn alternance
        run: python scraper_linkedin_alternance.py
        env:
          DISPLAY: ":99"
      - name: Commit resultats
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/offres_linkedin_alternance.json
          git diff --cached --quiet && echo "Rien de nouveau." || git commit -m "🤖 $(date '+%d/%m/%Y %H:%M') — Mise à jour LinkedIn alternance"
          git push
